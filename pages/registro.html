<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Crea tu cuenta gratuita en MatchCourt.">
  <title>Crear cuenta · MatchCourt</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="auth">
    <aside class="auth__aside">
      <a class="logo" href="login.html"><span class="logo__mark">M</span> MatchCourt</a>
      <div class="auth__photo" role="img" aria-label="Ilustración de una pista de pádel"></div>
      <div>
        <h2>Juega más. Organiza menos.</h2>
        <p>Crea tu cuenta gratis y empieza a reservar, apuntarte y jugar con tu gente.</p>
      </div>
    </aside>

    <div class="auth__main">
      <header class="auth__top">
        <span class="muted">¿Ya tienes cuenta?</span>
        <a class="btn btn--outline btn--sm" href="login.html">Iniciar sesión</a>
      </header>

      <main class="auth__card">
        <header>
          <h1>Crea tu cuenta</h1>
          <p class="muted">Solo te llevará un minuto.</p>
        </header>

        <form class="form" action="../index.html" method="get" data-validar data-exito="Tu cuenta se ha creado con éxito.">
          <div class="form__row">
            <div class="field">
              <label for="nombre">Nombre</label>
              <input class="input" type="text" id="nombre" name="nombre" placeholder="Carlos" autocomplete="given-name" required>
            </div>
            <div class="field">
              <label for="apellidos">Apellidos</label>
              <input class="input" type="text" id="apellidos" name="apellidos" placeholder="Ruiz Martín" autocomplete="family-name" required>
            </div>
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input class="input" type="email" id="email" name="email" placeholder="nombre@email.com" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="password">Contraseña</label>
            <input class="input" type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" minlength="8" autocomplete="new-password" required>
          </div>
          <button class="btn btn--primary btn--block" type="submit">Crear cuenta</button>
        </form>

        <p class="auth__alt">¿Ya tienes cuenta? <a class="link" href="login.html">Inicia sesión</a></p>
      </main>

      <footer class="auth__footer">© 2026 MatchCourt · Términos · Privacidad</footer>
    </div>
  </div>
  <script src="../js/mockData.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
